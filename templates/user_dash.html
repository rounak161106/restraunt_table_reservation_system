<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="main">
        <div id="canva2">
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Welcome {{ this_user.username }}!!</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/templates/user_req.html">Requests</a>
                        <li class="nav-item">
                        <a class="nav-link" href="/templates/login.html">Logout</a>
                        </li>
                    </ul>       
                    </div>
                </div>
            </nav>

            <!-- table management -->
            <div id="mngetable">
                <h2 class="headings">Available Tables</h2>

                <table class="table text-center border">
                    <thead>
                        <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Table No.</th>
                        <th scope="col">Capacity</th>
                        <th scope="col">Location</th>
                        <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for i in tables %}
                            <tr>
                                <td scope="row">1</td>
                                <td>{{i.table_number}}</td>
                                <td>{{i.capacity}}</td>
                                <td>{{i.location}}</td>
                                <td> <a href="/reserve" class="btn btn-primary">Reserve</a></td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
         </div>
    </div>
</body>
</html>
